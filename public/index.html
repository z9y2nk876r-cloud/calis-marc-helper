<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CALIS MARC 草稿生成器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f6f8; color: #222; margin: 0; padding: 24px 16px 64px; line-height: 1.6;
    }
    header { max-width: 920px; margin: 0 auto 18px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .lead { color: #666; font-size: 14px; margin: 0; }
    .card {
      max-width: 920px; margin: 0 auto 18px; background: #fff;
      border-radius: 10px; padding: 20px 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .card h2 { font-size: 16px; margin: 0 0 12px; }
    textarea, input[type="text"] {
      font-family: inherit; font-size: 14px; width: 100%;
      padding: 8px 10px; border: 1px solid #d0d4da; border-radius: 6px;
    }
    textarea { resize: vertical; }
    #raw-input { min-height: 140px; }
    #marc-output {
      min-height: 240px; font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 13px; background: #fafbfc;
    }
    .actions { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
    button {
      border: none; border-radius: 6px; padding: 8px 18px; font-size: 14px;
      cursor: pointer; background: #e8ebef; color: #222;
    }
    button:hover { background: #dce0e6; }
    button.primary { background: #222; color: #fff; }
    button.primary:hover { background: #444; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .hint { color: #777; font-size: 13px; }
    .error { color: #b00020; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid #eef0f3; }
    th { font-size: 13px; color: #666; font-weight: 600; background: #fafbfc; }
    td:first-child { width: 190px; font-size: 14px; white-space: nowrap; color: #444; }
    .required { color: #b00020; margin-left: 2px; }
    tr.missing td:last-child input,
    tr.missing td:last-child textarea { border-color: #e0a0a8; background: #fff7f8; }
  </style>
</head>
<body>

<header>
  <h1>CALIS MARC 草稿生成器</h1>
  <p class="lead">粘贴题名页 / 版权页文字 → 自动识别 → 核对修改 → 生成 MARC 草稿</p>
</header>

<!-- 模块 1：输入 -->
<section class="card">
  <h2>① 粘贴原文</h2>
  <textarea id="raw-input" placeholder="粘贴图书题名页、版权页或 CIP 数据文字，支持整段粘贴。粘贴后会自动识别字段。"></textarea>
  <div class="actions">
    <button id="btn-recognize">重新识别</button>
    <button id="btn-clear">清空表格</button>
    <span id="recognize-status" class="hint"></span>
  </div>
</section>

<!-- 模块 2：表格核对 -->
<section class="card">
  <h2>② 核对字段</h2>
  <p class="hint">自动识别仅供参考，请逐项核对，可以直接在右侧修改。带 <span class="required">*</span> 为必备项。</p>
  <table id="field-table">
    <thead>
      <tr><th>字段</th><th>内容</th></tr>
    </thead>
    <tbody id="field-tbody"></tbody>
  </table>
  <div class="actions">
    <button id="btn-generate" class="primary">确认生成 MARC 草稿</button>
    <span id="generate-status" class="hint"></span>
  </div>
</section>

<!-- 模块 3：输出 -->
<section class="card" id="output-card" style="display:none;">
  <h2>③ MARC 草稿</h2>
  <textarea id="marc-output" readonly></textarea>
  <div class="actions">
    <button id="btn-copy">复制草稿</button>
    <span id="copy-status" class="hint"></span>
  </div>
</section>

<script>
/* ===================== 字段定义 ===================== */
const FIELDS = [
  { key: 'title',          label: '正题名',                required: true,  type: 'input' },
  { key: 'subtitle',       label: '副题名',                required: false, type: 'input' },
  { key: 'author1',        label: '第一责任者',            required: true,  type: 'input' },
  { key: 'authors_other',  label: '其他责任者（分号分隔）', required: false, type: 'input' },
  { key: 'place',          label: '出版地',                required: true,  type: 'input' },
  { key: 'publisher',      label: '出版社',                required: true,  type: 'input' },
  { key: 'year',           label: '出版年',                required: true,  type: 'input' },
  { key: 'isbn',           label: 'ISBN',                  required: false, type: 'input' },
  { key: 'price',          label: '价格',                  required: false, type: 'input' },
  { key: 'pages',          label: '页数 / 册数',           required: true,  type: 'input' },
  { key: 'size',           label: '尺寸',                  required: false, type: 'input' },
  { key: 'series',         label: '丛编名',                required: false, type: 'input' },
  { key: 'series_volume',  label: '丛编卷标识',            required: false, type: 'input' },
  { key: 'note_resp',      label: '附注（304）',           required: false, type: 'textarea' },
  { key: 'holding_code',   label: '馆藏代码',              required: false, type: 'input' },
  { key: 'call_number',    label: '索书号',                required: false, type: 'input' },
];

/* ===================== 初始化表格 ===================== */
const tbody = document.getElementById('field-tbody');
FIELDS.forEach(f => {
  const tr = document.createElement('tr');
  tr.dataset.key = f.key;
  const tdLabel = document.createElement('td');
  tdLabel.innerHTML = f.label + (f.required ? '<span class="required">*</span>' : '');
  const tdValue = document.createElement('td');
  const el = document.createElement(f.type === 'textarea' ? 'textarea' : 'input');
  el.name = f.key;
  if (f.type === 'textarea') el.rows = 2;
  else el.type = 'text';
  tdValue.appendChild(el);
  tr.appendChild(tdLabel);
  tr.appendChild(tdValue);
  tbody.appendChild(tr);
});

/* ===================== 文本解析器 ===================== */
function parseText(raw) {
  const result = {};
  if (!raw || !raw.trim()) return result;

  const text = raw.replace(/\r\n/g, '\n');
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const full = lines.join('\n');

  // --- ISBN ---
  const isbnPatterns = [
    /ISBN[\s:：]*([\d\-]{10,17}[Xx\d])/i,
    /(97[89][\-\s]?[\d]{1,5}[\-\s]?[\d]{1,7}[\-\s]?[\d]{1,7}[\-\s]?[\dXx])/i,
  ];
  for (const re of isbnPatterns) {
    const m = full.match(re);
    if (m) {
      const v = m[1].replace(/\s/g, '');
      if (v.replace(/-/g, '').length >= 10) { result.isbn = v; break; }
    }
  }

  // --- 价格 ---
  const priceMatch = full.match(/(?:CNY|RMB|￥|¥|定价[\s:：]*)\s*([\d]+(?:\.\d{1,2})?)\s*元?/i);
  if (priceMatch) {
    const raw0 = priceMatch[0].trim();
    if (/^CNY/i.test(raw0)) result.price = raw0;
    else result.price = `CNY${priceMatch[1]}`;
  }

  // --- 页数 / 册数 ---
  const pagesMatch = full.match(/(\d+)\s*页/);
  if (pagesMatch) result.pages = pagesMatch[1] + '页';
  else {
    const volMatch = full.match(/(\d+)\s*册/);
    if (volMatch) result.pages = volMatch[1] + '册';
  }

  // --- 尺寸 ---
  const sizeMatch = full.match(/(\d+(?:\.\d+)?)\s*(?:cm|厘米)/i);
  if (sizeMatch) result.size = sizeMatch[1] + 'cm';

  // --- 出版年 ---
  let year = '';
  const yearNearPub = full.match(/(?:出版社|书局|出版公司|出版集团)[,，\s]*(\d{4})/);
  if (yearNearPub) year = yearNearPub[1];
  if (!year) {
    const ym = full.match(/出版[年月]?[：:\s,，]*(\d{4})/);
    if (ym) year = ym[1];
  }
  if (!year) {
    const ym = full.match(/(\d{4})\s*年/);
    if (ym) year = ym[1];
  }
  if (year) result.year = year;

  // --- 出版社 ---
  const pubMatch = full.match(/([\u4e00-\u9fa5A-Za-z0-9（）()·]{2,25}(?:出版社|书局|出版公司|出版集团|印书馆|出版有限责任公司))/);
  if (pubMatch) result.publisher = pubMatch[1];

  // --- 出版地 ---
  const placeMatch = full.match(/(?:--?\s*)?([\u4e00-\u9fa5]{2,8})\s*[:：]\s*[\u4e00-\u9fa5A-Za-z0-9]+(?:出版社|书局|出版)/);
  if (placeMatch) result.place = placeMatch[1];
  if (!result.place) {
    const cities = ['北京','上海','广州','深圳','南京','杭州','天津','武汉','成都','西安','重庆','长沙','济南','郑州','合肥','福州','厦门','南昌','太原','石家庄','沈阳','长春','哈尔滨','昆明','贵阳','南宁','海口','兰州','西宁','银川','乌鲁木齐','呼和浩特','拉萨','香港','澳门','台北'];
    for (const c of cities) {
      if (full.includes(c)) { result.place = c; break; }
    }
  }

  // --- 丛编 ---
  const seriesMatch = full.match(/([\u4e00-\u9fa5A-Za-z0-9（）()·]{2,30}(?:丛书|丛编|系列|文库))/);
  if (seriesMatch) result.series = seriesMatch[1];

  // --- 题名与责任者 ---
  // 策略 1：CIP 格式 “题名 / 责任者. -- 出版信息”
  let titleRespMatch = full.match(/^([^\n\/／]+?)\s*[\/／]\s*([^\n]+)/m);
  if (titleRespMatch) {
    result.title = titleRespMatch[1].trim();
    let respStr = titleRespMatch[2].trim();
    // 去掉责任者后的 “. -- 出版信息”
    respStr = respStr.replace(/[.。]\s*[-—]{1,2}\s*[\s\S]*$/, '').trim();
    const respParts = respStr.split(/[；;]/).map(s => s.trim()).filter(Boolean);
    if (respParts.length > 0) {
      result.author1 = respParts[0];
      if (respParts.length > 1) result.authors_other = respParts.slice(1).join('；');
    }
  }

  // 策略 2：兜底，从第一行里找 “题名 作者著”
  if (!result.title) {
    for (const line of lines) {
      if (/^图书在版编目/.test(line)) continue;
      if (/^ISBN/i.test(line)) continue;
      if (/^[\d\-\s]+$/.test(line)) continue;
      if (/^[IVX]+\./.test(line)) continue;
      if (/^[A-Z]\./.test(line)) continue;

      const m = line.match(/^(.+?)\s+([\u4e00-\u9fa5]{2,4})\s*(?:著|编著|主编|编|译)/);
      if (m) {
        result.title = m[1].trim();
        const authorsInLine = line.match(/([\u4e00-\u9fa5]{2,4})\s*(?:著|编著|主编|编|译)/g);
        if (authorsInLine && authorsInLine.length > 0) {
          result.author1 = authorsInLine[0].trim();
          if (authorsInLine.length > 1) result.authors_other = authorsInLine.slice(1).join('；');
        }
        break;
      }
      if (line.length > 1 && line.length < 100) { result.title = line; break; }
    }
  }

  // 兜底找作者
  if (!result.author1) {
    const authorMatch = full.match(/([\u4e00-\u9fa5]{2,4})\s*(?:著|编著|主编|编|译)/);
    if (authorMatch) result.author1 = authorMatch[0].trim();
  }

  // --- 副题名分离 ---
  if (result.title) {
    const titleSplit = result.title.match(/^(.+?)\s*[：:]\s*(.+)$/);
    if (titleSplit && titleSplit[2].length > 0 && titleSplit[2].length < 60) {
      result.title = titleSplit[1].trim();
      result.subtitle = titleSplit[2].trim();
    }
  }

  return result;
}

/* ===================== 识别动作 ===================== */
const rawInput = document.getElementById('raw-input');
const recognizeStatus = document.getElementById('recognize-status');

function recognize(showMsg) {
  const raw = rawInput.value;
  const parsed = parseText(raw);

  FIELDS.forEach(f => {
    const el = document.querySelector(`[name="${f.key}"]`);
    if (!el) return;
    if (f.key in parsed) el.value = parsed[f.key];
  });

  if (showMsg) {
    const count = Object.keys(parsed).length;
    recognizeStatus.textContent = count > 0
      ? `已识别 ${count} 个字段，请在下方核对。`
      : '未能自动识别，请手动填写下方表格。';
  }
}

// 粘贴后自动识别
rawInput.addEventListener('paste', () => setTimeout(() => recognize(true), 50));

// 手动重新识别
document.getElementById('btn-recognize').addEventListener('click', () => {
  if (!rawInput.value.trim()) {
    recognizeStatus.textContent = '请先粘贴文字。';
    return;
  }
  recognize(true);
});

// 清空表格
document.getElementById('btn-clear').addEventListener('click', () => {
  document.querySelectorAll('#field-tbody input, #field-tbody textarea').forEach(el => {
    el.value = '';
  });
  recognizeStatus.textContent = '表格已清空。';
  document.getElementById('output-card').style.display = 'none';
});

/* ===================== 生成 MARC ===================== */
const btnGenerate = document.getElementById('btn-generate');
const generateStatus = document.getElementById('generate-status');

btnGenerate.addEventListener('click', async () => {
  const payload = {};
  document.querySelectorAll('#field-tbody input, #field-tbody textarea').forEach(el => {
    payload[el.name] = el.value.trim();
  });

  // 清空高亮
  document.querySelectorAll('#field-tbody tr').forEach(tr => tr.classList.remove('missing'));

  // 必备项校验
  const missing = FIELDS.filter(f => f.required && !payload[f.key]);
  if (missing.length) {
    missing.forEach(f => {
      const tr = document.querySelector(`#field-tbody tr[data-key="${f.key}"]`);
      if (tr) tr.classList.add('missing');
    });
    generateStatus.textContent = '请填写必备字段：' + missing.map(f => f.label).join('、');
    generateStatus.className = 'hint error';
    return;
  }

  generateStatus.textContent = '正在生成…';
  generateStatus.className = 'hint';
  btnGenerate.disabled = true;

  try {
    const resp = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(errText || '生成失败');
    }
    const data = await resp.json();
    document.getElementById('marc-output').value = data.marc;
    document.getElementById('output-card').style.display = 'block';
    generateStatus.textContent = '已生成，请核对。';
    generateStatus.className = 'hint';
  } catch (err) {
    generateStatus.textContent = '出错：' + err.message;
    generateStatus.className = 'hint error';
  } finally {
    btnGenerate.disabled = false;
  }
});

/* ===================== 复制草稿 ===================== */
document.getElementById('btn-copy').addEventListener('click', async () => {
  const out = document.getElementById('marc-output');
  const copyStatus = document.getElementById('copy-status');
  try {
    await navigator.clipboard.writeText(out.value);
    copyStatus.textContent = '已复制到剪贴板。';
  } catch (err) {
    out.select();
    document.execCommand('copy');
    copyStatus.textContent = '已复制（兼容模式）。';
  }
});
</script>

</body>
</html>
